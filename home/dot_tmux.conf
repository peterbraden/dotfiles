#set -g utf8
#set-window-option -g utf8 on

set -g default-terminal "tmux-256color"
# True colour
# Fixed index rather than -a, so reloading doesn't append duplicates.
set-option -s terminal-features[100] '*:RGB'


set -g prefix C-a
unbind C-b

set-option -g default-command $SHELL
set-option -g default-shell $SHELL


# Integrate with clipboard
#set-option -g default-command "which reattach-to-user-namespace > /dev/null && reattach-to-user-namespace -l $SHELL || $SHELL"

#set-window-option -g automatic-rename on

# Same as screen ctrl-a-a
bind-key C-a last-window
# beginning of line
bind a send-prefix
# Kill with x
bind k kill-window

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Without this the outer terminal turns the wheel into arrow keys, which
# full-screen programs (Claude Code) read as history navigation. With it,
# the wheel goes to programs that track the mouse and otherwise opens copy
# mode. Shift-drag still gives the terminal's native selection.
set -g mouse on
set -g history-limit 50000
set -g focus-events on

set-option -g message-style bg=black,fg=green
set-option -g status-style bg=black

set -g window-status-style bg=black,fg=colour244
set-window-option -g window-status-current-style fg=red
setw -g window-status-activity-style bg=black,fg=yellow
set-option -g window-status-current-format "#I:#{pane_current_command}#F"
set-option -g window-status-format '#I:#{pane_current_command}#F'
set-option -g status-interval 1
set -g status-right-length 100
set -g status-right "#[fg=black,bg=blue] #S #[fg=black,bg=yellow] #(whoami)@#h #[fg=black,bg=red] #({ hostname -I 2>/dev/null || ipconfig getifaddr en0 || ipconfig getifaddr en1; } | cut -d\" \" -f1)"
set -g status-left ""


# iterm scroll
#set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Neovim asked
#set-option -sg escape-time 10

# Session tree sidebar
bind t run-shell 'tmux-tree'

